<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide number input spinners */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-100 flex items-center justify-center p-4 font-sans text-slate-800">
    
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl shadow-indigo-900/10 overflow-hidden border border-white/50 backdrop-blur-sm">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center text-white">
            <div class="flex justify-center mb-3">
                <div class="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                    <!-- Calculator Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-50"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="12" y1="18" y2="18"/></svg>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Interest Calculator</h1>
        </div>

        <div class="p-6 sm:p-8">
            <!-- Tab Navigation -->
            <div class="flex p-1 space-x-1 bg-slate-100 rounded-xl mb-8">
                <button type="button" id="tab-simple" onclick="switchTab('simple')" class="flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 bg-white text-indigo-700 shadow-sm ring-1 ring-slate-900/5">
                    <!-- Activity Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <span>Simple Interest</span>
                </button>
                <button type="button" id="tab-compound" onclick="switchTab('compound')" class="flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50">
                    <!-- Activity Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <span>Compound Interest</span>
                </button>
            </div>

            <!-- Calculator Form -->
            <form id="calc-form" class="space-y-5">
                
                <!-- Principal Input -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Principal Amount</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <!-- Indian Rupee Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>
                        </div>
                        <input type="number" id="input-principal" name="principal" onwheel="this.blur()" class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" required />
                    </div>
                </div>

                <!-- Date Inputs Container -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- Start Date -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Start Date</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <!-- Calendar Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            </div>
                            <input type="text" id="input-start-date" name="startDate" placeholder="DD/MM/YYYY" class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" required />
                        </div>
                    </div>

                    <!-- End Date -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">End Date</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <!-- Calendar Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            </div>
                            <input type="text" id="input-end-date" name="endDate" placeholder="DD/MM/YYYY" class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" required />
                        </div>
                    </div>
                </div>

                <!-- Rate of Interest -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Interest</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <!-- Percent Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
                        </div>
                        <input type="number" step="0.01" id="input-rate" name="rate" onwheel="this.blur()" class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" required />
                    </div>
                </div>

                <!-- Submit and Clear Buttons -->
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="handleClear()" class="flex-1 py-3.5 px-4 border border-slate-200 rounded-xl shadow-sm text-base font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 transition-colors duration-200">
                        Clear
                    </button>
                    <button type="submit" class="flex-[2] flex items-center justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200">
                        Calculate
                    </button>
                </div>
                
            </form>

            <!-- Dynamic Results Area -->
            <div id="results-container" class="hidden mt-8 p-5 rounded-2xl bg-indigo-50 border border-indigo-100 transition-all duration-300">
                <h3 class="text-sm font-medium text-indigo-800 uppercase tracking-wider mb-4">Calculation Results</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Principal Amount:</span>
                        <span id="res-principal" class="font-semibold text-slate-900">₹0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Total Interest:</span>
                        <span id="res-interest" class="font-semibold text-emerald-600">+₹0</span>
                    </div>
                    <div class="pt-3 mt-3 border-t border-indigo-200/60 flex justify-between items-center">
                        <span class="font-medium text-slate-800">Total Amount:</span>
                        <span id="res-total" class="text-xl font-bold text-indigo-700">₹0</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // State Management
        const state = {
            activeTab: 'simple',
            formData: {
                simple: { principal: '', startDate: '', endDate: '', rate: '' },
                compound: { principal: '', startDate: '', endDate: '', rate: '' }
            },
            results: {
                simple: null,
                compound: null
            }
        };

        // DOM Elements
        const inputs = {
            principal: document.getElementById('input-principal'),
            startDate: document.getElementById('input-start-date'),
            endDate: document.getElementById('input-end-date'),
            rate: document.getElementById('input-rate')
        };
        const resultsContainer = document.getElementById('results-container');
        const resPrincipal = document.getElementById('res-principal');
        const resInterest = document.getElementById('res-interest');
        const resTotal = document.getElementById('res-total');
        const form = document.getElementById('calc-form');

        // Styles for active/inactive tabs
        const activeTabClasses = "flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 bg-white text-indigo-700 shadow-sm ring-1 ring-slate-900/5";
        const inactiveTabClasses = "flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50";

        // Tab Switching Logic
        function switchTab(tab) {
            state.activeTab = tab;
            
            // Update UI Tab Styling
            if (tab === 'simple') {
                document.getElementById('tab-simple').className = activeTabClasses;
                document.getElementById('tab-compound').className = inactiveTabClasses;
            } else {
                document.getElementById('tab-compound').className = activeTabClasses;
                document.getElementById('tab-simple').className = inactiveTabClasses;
            }

            // Repopulate form inputs from state
            inputs.principal.value = state.formData[tab].principal;
            inputs.startDate.value = state.formData[tab].startDate;
            inputs.endDate.value = state.formData[tab].endDate;
            inputs.rate.value = state.formData[tab].rate;

            // Render Results
            renderResults();
        }

        // Input Handling & Date Formatting
        function handleInput(e) {
            const name = e.target.name;
            let value = e.target.value;
            const oldValue = state.formData[state.activeTab][name] || '';

            if (name === 'startDate' || name === 'endDate') {
                // Allow smooth backspacing
                if (value.length < oldValue.length) {
                    // Do nothing, let it delete
                } else {
                    let digits = value.replace(/\D/g, '').substring(0, 8);
                    let formatted = '';
                    
                    if (digits.length > 0) formatted += digits.substring(0, 2);
                    if (digits.length >= 3) formatted += '/' + digits.substring(2, 4);
                    if (digits.length >= 5) formatted += '/' + digits.substring(4, 8);
                    
                    if ((digits.length === 2 || digits.length === 4) && value.slice(-1) !== '/') {
                        formatted += '/';
                    }
                    
                    value = formatted;
                    e.target.value = value;
                }
            }

            // Save to state
            state.formData[state.activeTab][name] = value;
        }

        // Attach input listeners
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', handleInput);
        });

        // Clear Function
        function handleClear() {
            state.formData[state.activeTab] = { principal: '', startDate: '', endDate: '', rate: '' };
            state.results[state.activeTab] = null;
            
            inputs.principal.value = '';
            inputs.startDate.value = '';
            inputs.endDate.value = '';
            inputs.rate.value = '';
            
            renderResults();
        }

        // Result Rendering
        function renderResults() {
            const currentResult = state.results[state.activeTab];
            
            if (currentResult) {
                resPrincipal.textContent = `₹${currentResult.principal}`;
                resTotal.textContent = `₹${currentResult.total}`;
                
                // Format Interest
                if (currentResult.interest >= 0) {
                    resInterest.textContent = `+₹${currentResult.interest}`;
                    resInterest.className = "font-semibold text-emerald-600";
                } else {
                    resInterest.textContent = `-₹${Math.abs(currentResult.interest)}`;
                    resInterest.className = "font-semibold text-rose-600";
                }
                
                resultsContainer.classList.remove('hidden');
            } else {
                resultsContainer.classList.add('hidden');
            }
        }

        // Calculation Logic (Your exact C++ logic)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentData = state.formData[state.activeTab];
            
            let p = parseInt(currentData.principal, 10) || 0;
            const r = parseFloat(currentData.rate) || 0;
            const originalP = p;
            
            // Parse dates
            let date1Parts = currentData.startDate.split('/').map(Number);
            let date2Parts = currentData.endDate.split('/').map(Number);
            let d1 = date1Parts[0], m1 = date1Parts[1], y1 = date1Parts[2];
            let d2 = date2Parts[0], m2 = date2Parts[1], y2 = date2Parts[2];

            if (!d1 || !m1 || !y1 || !d2 || !m2 || !y2) {
                alert("Please enter valid dates in DD/MM/YYYY format.");
                return;
            }

            let sum = 0;
            let k = 0;

            if (d2 > d1) {
                sum += (d2 - d1);
            } else {
                k = 0;
                k = d2 + 30;
                m2--;
                sum += (k - d1);
            }

            if (m2 > m1) {
                sum += (m2 - m1) * 30;
            } else {
                k = 0;
                k = m2 + 12;
                y2--;
                sum += (k - m1) * 30;
            }

            if (state.activeTab === 'simple') {
                sum += (y2 - y1) * 360;
                const res = Math.trunc((p * r * sum) / 3000);
                
                state.results.simple = {
                    principal: originalP,
                    interest: res,
                    total: originalP + res
                };
            } else if (state.activeTab === 'compound') {
                let n = y2 - y1;
                
                for (let i = 0; i < n; i++) {
                    p += Math.trunc((p * r * 360) / 3000);
                }
                
                const res = Math.trunc((p * r * sum) / 3000);
                const finalTotalAmount = p + res;
                const totalInterestEarned = finalTotalAmount - originalP;

                state.results.compound = {
                    principal: originalP,
                    interest: totalInterestEarned,
                    total: finalTotalAmount
                };
            }

            renderResults();
        });

        // Initialize state UI on load
        switchTab('simple');
    </script>
</body>
</html>
